<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DraftMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:none;--ink:#010a13;--panel:rgba(8,18,30,.86);--panel2:#0e1a28;--line:#273647;--txt:#f0e6d2;--mut:#a09b8c;--acc:#0ac8b9;--gold:#c8aa6e;--gold2:#f0e6d2;--gold3:#785a28;--blue:#3fa7ff;--red:#ff4d5e;--ok:#3ddc84}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:transparent}
body::before{content:"";position:fixed;inset:-24px;background:var(--bg) center 22%/cover no-repeat,radial-gradient(1200px 700px at 50% -10%,#14304a,#010a13);filter:brightness(.34) saturate(1.15) blur(1.5px);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(1,10,19,.88) 100%),linear-gradient(180deg,rgba(1,10,19,.15),rgba(1,10,19,.8));z-index:-1;pointer-events:none}
#app{max-width:1320px;margin:0 auto;padding:18px}
h1,h2,h3{margin:0 0 10px;font-family:Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--gold2)}
h2{font-size:22px}h3{font-size:16px;color:var(--gold)}
.logo{font-family:Cinzel,Georgia,serif;font-size:44px;font-weight:900;letter-spacing:.08em;background:linear-gradient(180deg,#f0e6d2 10%,#c8aa6e 55%,#785a28);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(200,170,110,.35))}
.mut{color:var(--mut)}.small{font-size:12px}
.panel{background:var(--panel);border:1px solid var(--gold3);border-radius:6px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(240,230,210,.06);backdrop-filter:blur(6px);position:relative}
.panel::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.85;pointer-events:none}
.center{max-width:440px;margin:8vh auto;text-align:center}
input{width:100%;padding:12px 14px;border-radius:4px;border:1px solid var(--gold3);background:rgba(1,10,19,.8);color:var(--txt);font-size:16px;margin:6px 0;font-family:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,170,110,.15)}
button{cursor:pointer;font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.05em;font-size:14px;color:#cdfafa;padding:11px 18px;border-radius:4px;border:2px solid transparent;background:linear-gradient(180deg,#0b4f5c,#08323d) padding-box,linear-gradient(180deg,#0ac8b9,#0a6873) border-box;box-shadow:0 0 0 1px #000 inset,0 4px 14px rgba(0,0,0,.35);transition:transform .1s,filter .15s,box-shadow .2s}
button:hover{filter:brightness(1.18);box-shadow:0 0 0 1px #000 inset,0 0 18px rgba(10,200,185,.35)}
button:active{transform:scale(.97)}
button.sec{color:var(--gold2);background:linear-gradient(180deg,#1e2328,#12161b) padding-box,linear-gradient(180deg,#c8aa6e,#785a28) border-box}
button.sec:hover{box-shadow:0 0 0 1px #000 inset,0 0 16px rgba(200,170,110,.3)}
button.gold{color:#1e1405;background:linear-gradient(180deg,#f0d48c,#c8aa6e 55%,#a07c3a) padding-box,linear-gradient(180deg,#fff2c8,#785a28) border-box}
button:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.6)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.tile{position:relative;background:linear-gradient(180deg,#132232,#0a1320);border:1px solid var(--gold3);border-radius:6px;padding:0 0 6px;text-align:center;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 12px rgba(200,170,110,.25)}
.tile img{width:100%;aspect-ratio:1;border-radius:5px 5px 0 0;display:block;background:#0c1220;object-fit:cover}
.tile .n{font-size:12px;font-weight:700;margin-top:5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold2)}
.tile .s{font-size:10px;color:var(--mut)}
.tile .r{position:absolute;top:4px;left:4px;background:rgba(1,10,19,.85);border:1px solid var(--gold3);color:var(--gold);font-size:9px;font-weight:800;border-radius:3px;padding:1px 4px;z-index:2}
.tile.off{opacity:.22;cursor:default;filter:grayscale(1)}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 22px rgba(10,200,185,.5)}
.tile.dis{opacity:.28;pointer-events:none;filter:grayscale(1)}
.modal{position:fixed;inset:0;background:rgba(1,6,12,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal>.panel{max-width:780px;width:100%;max-height:92vh;overflow:auto}
.tag{display:inline-block;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:800;background:rgba(1,10,19,.7);border:1px solid var(--gold3);color:var(--gold2)}
.tag.new{background:var(--acc);color:#04201e;border:0}
.draftbar{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:14px}
.side{padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px)}
.side b{font-family:Cinzel,serif;font-size:17px}
.side.blue{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}.side.red{border-color:var(--red);box-shadow:inset -4px 0 0 var(--red);text-align:right}
.side.red .slots{justify-content:flex-end}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.slot{width:64px;height:64px;border-radius:6px;border:1px solid var(--gold3);background:rgba(1,10,19,.7);overflow:hidden;position:relative}
.slot.ban{width:38px;height:38px;border-color:#5a2a2a}.slot.ban img{filter:grayscale(1) brightness(.5)}
.slot.ban:not(:empty)::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,rgba(255,77,94,.85) 48%,rgba(255,77,94,.85) 52%,transparent 54%)}
.slot img{width:100%;height:100%;object-fit:cover;display:block;animation:pop .35s both}
.slot.cur{border:2px solid var(--gold);animation:blink 1s infinite;box-shadow:0 0 16px rgba(200,170,110,.6)}
@keyframes blink{50%{box-shadow:0 0 3px rgba(200,170,110,.2)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.timer{font-family:Cinzel,serif;font-size:40px;font-weight:900;text-align:center;min-width:90px;color:var(--gold2);text-shadow:0 0 18px rgba(200,170,110,.5);align-self:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(1,10,19,.95);border:1px solid var(--gold);padding:10px 18px;border-radius:6px;z-index:99}
.skins{display:flex;gap:8px;flex-wrap:wrap}
.skin{width:90px;font-size:10px;text-align:center;cursor:pointer;border:1px solid var(--gold3);border-radius:6px;padding:3px;background:rgba(1,10,19,.6)}
.skin img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.skin.lock{opacity:.3;cursor:not-allowed}.skin.on{border-color:var(--gold);box-shadow:0 0 12px rgba(200,170,110,.5)}
.tb{color:var(--blue)}.tr{color:var(--red)}
.cv{font-weight:900;font-variant-numeric:tabular-nums}
/* --- v2 : badges, placement, coffre, maîtrise, son --- */
.tile .mc{position:absolute;top:-5px;right:-5px;width:30px;filter:drop-shadow(0 2px 2px #000c);z-index:2}
.tile .mc svg{width:100%;display:block}
.tile .bd{position:absolute;left:4px;top:58px;display:flex;flex-direction:column;gap:2px;z-index:2}
.cb{display:inline-block;font-size:10px;font-weight:900;border-radius:5px;padding:1px 5px;white-space:nowrap}
.cb.up{background:#1fbf6a;color:#03140a}.cb.dn.est{background:rgba(1,10,19,.85);border:1px solid var(--red);color:#ff9aa5}.cb.up.est{background:rgba(1,10,19,.85);border:1px solid #1fbf6a;color:#3ddc84}.cb.dn{background:var(--red);color:#1a0306}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{padding:5px 11px;border-radius:99px;font-size:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.chips button.on{background:var(--acc);color:#06121a;border-color:var(--acc)}
.posrow{display:grid;grid-template-columns:48px 56px 1fr auto;gap:12px;align-items:center;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.posrow:hover{transform:translateX(3px)}.posrow.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.posrow img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#0c1220}
.fit{font-size:12px;font-weight:800}.fit.ok{color:#1fbf6a}.fit.mid{color:var(--gold)}.fit.no{color:var(--red)}
.vs{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);animation:pop .4s both}
.vs:nth-child(3){animation-delay:.1s}.vs:nth-child(4){animation-delay:.2s}.vs:nth-child(5){animation-delay:.3s}.vs:nth-child(6){animation-delay:.4s}.vs:nth-child(7){animation-delay:.5s}
.vs .l,.vs .r{display:flex;align-items:center;gap:10px;font-weight:800}.vs .r{justify-content:flex-end}
.vs .c{text-align:center;font-size:12px}
.vs img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#0c1220}
.chestStage{position:relative;height:290px;display:flex;align-items:center;justify-content:center;perspective:900px;overflow:hidden}
.chest{position:relative;width:210px;height:160px;cursor:pointer;animation:float 2.4s ease-in-out infinite;transform-style:preserve-3d}
.chest .base{position:absolute;bottom:0;left:0;right:0;height:100px;border-radius:10px 10px 16px 16px;background:linear-gradient(#2c3274,#12153d);border:4px solid #c8aa6e;box-shadow:inset 0 0 0 3px #0a0c28,0 14px 30px #000a;overflow:hidden}
.chest .lid{position:absolute;top:0;left:-6px;right:-6px;height:68px;border-radius:70px 70px 10px 10px/44px 44px 10px 10px;background:linear-gradient(#40479a,#1d2160);border:4px solid #c8aa6e;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.5,-0.4,.4,1.5);z-index:2;overflow:hidden}
.chest .band{position:absolute;left:50%;top:0;bottom:0;width:28px;transform:translateX(-50%);background:linear-gradient(90deg,#8a6d3b,#f0d48c,#8a6d3b)}
.chest .core{position:absolute;left:50%;top:42px;width:48px;height:48px;margin-left:-24px;transform:rotate(45deg);background:radial-gradient(#e9ffff,#38e1ff 40%,#0a6fa0);border:4px solid #f0d48c;box-shadow:0 0 22px #38e1ff,0 0 50px #38e1ff88;z-index:3;animation:pulse 1.6s infinite}
.chest.shake{animation:shake .65s}
.chest.open{animation:none}.chest.open .lid{transform:translateY(-58px) rotate(-16deg);box-shadow:0 30px 60px #38e1ff}
.chest.open .core{animation:none;box-shadow:0 0 70px #fff,0 0 140px #38e1ff}
.burst{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(#fff,#7ff3ff 30%,#38e1ff00 70%);animation:burst .9s ease-out forwards;pointer-events:none;z-index:5}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px;border-radius:50%;background:repeating-conic-gradient(#38e1ff2a 0 6deg,transparent 6deg 18deg);animation:spin 10s linear infinite;-webkit-mask:radial-gradient(#000 15%,transparent 65%);mask:radial-gradient(#000 15%,transparent 65%);pointer-events:none}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#bff6ff;box-shadow:0 0 8px #38e1ff;animation:spark 1s ease-out forwards;pointer-events:none;z-index:6}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes pulse{50%{box-shadow:0 0 34px #38e1ff,0 0 80px #38e1ffaa}}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-7deg) scale(1.03)}35%{transform:rotate(7deg) scale(1.06)}55%{transform:rotate(-6deg) scale(1.09)}75%{transform:rotate(5deg) scale(1.12)}}
@keyframes burst{to{transform:scale(20);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.fcards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.fcard{width:170px;height:290px;perspective:900px;cursor:pointer;animation:fly .65s cubic-bezier(.2,1.3,.4,1) both}
.fcard:nth-child(2){animation-delay:.15s}.fcard:nth-child(3){animation-delay:.3s}
@keyframes fly{from{transform:translateY(-200px) scale(.15) rotate(-25deg);opacity:0}}
.fcard .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.fcard:hover:not(.flip) .in{transform:translateY(-8px) rotate(-1deg)}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:12px;overflow:hidden;border:3px solid #c8aa6e;background:#0c1220}
.fcard .back{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2a6f9a 0,#13284a 45%,#0a1020 100%)}
.fcard .back::before{content:"";width:72px;height:72px;transform:rotate(45deg);border:4px solid #c8aa6e;background:radial-gradient(#bff6ff,#38e1ff 45%,#0a6fa0);box-shadow:0 0 25px #38e1ff}
.fcard .back::after{content:"HEXTECH";position:absolute;bottom:18px;font-weight:900;letter-spacing:.3em;font-size:11px;color:#c8aa6e}
.fcard .front{transform:rotateY(180deg)}
.fcard .front img{width:100%;height:205px;object-fit:cover;object-position:top;display:block;background:#0c1220}
.fcard .front .cap{padding:6px;text-align:center;font-weight:800;font-size:14px}
.fcard.new.flip .front{border-color:#38e1ff;box-shadow:0 0 28px #38e1ff}
.fcard.up.flip .front{border-color:#f0d48c;box-shadow:0 0 28px #f2b84b}
.fcard .crestpop{position:absolute;left:50%;top:112px;width:86px;margin-left:-43px;z-index:2;filter:drop-shadow(0 4px 6px #000)}
.fcard.flip .crestpop{animation:crestpop 1s .45s both}
.tag.mq{background:linear-gradient(90deg,#c8aa6e,#f0d48c);color:#221700;border:0}
@keyframes crestpop{0%{transform:scale(0) rotate(-35deg)}60%{transform:scale(1.4) rotate(6deg)}100%{transform:scale(1)}}
.lvl{position:relative;display:flex;align-items:center;gap:16px;margin:8px 0}
.lvl .cw{position:relative;width:110px;height:120px;flex:none}
.lvl .cw .rays{width:240px;height:240px;margin:-120px;background:repeating-conic-gradient(#f2b84b40 0 6deg,transparent 6deg 18deg)}
.lvl .cw svg{position:relative;width:110px;animation:crestpop 1s both}
.mbar{height:10px;border-radius:9px;background:#0c1220;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.mbar div{height:100%;background:linear-gradient(90deg,#c8aa6e,#f0d48c);animation:grow 1s ease-out both}
@keyframes grow{from{width:0!important}}
.cl{display:flex;flex-wrap:wrap;gap:6px}.cl span{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 8px 2px 2px;font-size:12px}
.cl img{width:22px;height:22px;border-radius:50%}
.sound{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;gap:6px}
.sound button{padding:7px 10px;font-size:16px;background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.sound button.off{opacity:.45}
/* --- v3 : menu, connexion, combat --- */
.chips button,.sound button,.maptools button,.emo,.posrow,.cb{text-transform:none;letter-spacing:0}
.chips button{font-family:Inter,sans-serif}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.topbar .logo{font-size:34px}
.pinfo{display:flex;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}.pinfo span{border:1px solid var(--gold3);padding:4px 9px;border-radius:3px;background:rgba(1,10,19,.6)}
.hero{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:stretch}
@media(max-width:880px){.hero{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:14px}
.pav{position:relative;width:92px;height:92px;flex:none}.pav img{width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;box-shadow:0 0 24px rgba(200,170,110,.45);background:#0c1220}
.pav.empty{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--gold3);font-size:32px;color:var(--gold3)}
.pav .pcr{position:absolute;right:-12px;bottom:-14px;width:46px;filter:drop-shadow(0 3px 4px #000)}
.playgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.play{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3px;min-height:150px;padding:18px;text-align:left;position:relative;overflow:hidden}
.play .pi{font-size:36px;margin-bottom:auto;filter:drop-shadow(0 3px 6px #000)}
.play .pt{font-size:19px}.play small{font-family:Inter,sans-serif;text-transform:none;letter-spacing:0;font-weight:500;opacity:.85}
.play.big{grid-row:span 2;background:linear-gradient(160deg,rgba(10,200,185,.35),rgba(8,40,52,.96) 60%) padding-box,linear-gradient(180deg,#0ac8b9,#0a6873) border-box}
.play.big .pt{font-size:30px}.play.big .pi{font-size:56px}
.play.wide{grid-column:span 2}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-110%);transition:transform .7s}
.play:hover:not(:disabled)::after{transform:translateX(110%)}
.play:hover:not(:disabled){transform:translateY(-2px)}
@media(max-width:700px){.playgrid{grid-template-columns:1fr 1fr}.play.big{grid-column:span 2;grid-row:auto}}
.minichest{width:64px;height:48px;margin-bottom:auto;position:relative;border:3px solid #c8aa6e;border-radius:20px 20px 6px 6px;background:linear-gradient(#40479a,#1d2160);box-shadow:0 0 22px #38e1ff88;animation:float 2.4s ease-in-out infinite}
.minichest::after{content:"";position:absolute;left:50%;top:12px;width:16px;height:16px;margin-left:-8px;transform:rotate(45deg);background:radial-gradient(#e9ffff,#38e1ff);box-shadow:0 0 12px #38e1ff}
.warn{background:rgba(255,77,94,.12);border:1px solid var(--red);padding:10px 14px;border-radius:4px;margin:12px 0}
.rules{margin-top:16px}.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.rgrid p{margin:6px 0 0;color:var(--mut);font-size:13px;line-height:1.5}
.login{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;min-height:86vh}
@media(max-width:880px){.login{grid-template-columns:1fr;gap:20px}}
.logo.big{font-size:clamp(46px,7vw,80px);line-height:1}
.tagline{font-family:Cinzel,serif;font-size:18px;color:var(--gold);letter-spacing:.08em}
.feat{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px;max-width:520px}.feat li{background:rgba(1,10,19,.6);border-left:3px solid var(--gold);padding:11px 14px;border-radius:0 4px 4px 0;animation:rise .5s both}
.feat li:nth-child(2){animation-delay:.1s}.feat li:nth-child(3){animation-delay:.2s}
.lform{max-width:420px;width:100%;justify-self:center}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
/* combat */
.gtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border:1px solid var(--gold3);border-radius:6px 6px 0 0;backdrop-filter:blur(6px)}
.gteam{display:flex;align-items:center;gap:14px;font-weight:800}.gteam.red{justify-content:flex-end}
.gteam b{font-family:Cinzel,serif;font-size:17px}.gteam.blue b{color:var(--blue)}.gteam.red b{color:var(--red)}
.gteam>span{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--gold2)}
.gteam .kk{font-family:Cinzel,serif;font-size:26px;font-weight:900;font-style:normal}
.gteam.blue .kk{color:var(--blue)}.gteam.red .kk{color:var(--red)}
.gclock{text-align:center;font-family:Cinzel,serif}#clock{font-size:30px;font-weight:900;color:var(--gold2);display:block;line-height:1.1}.gclock small{font-family:Inter,sans-serif;font-size:11px;color:var(--mut)}

function wrAt(curve,min){
  if(min<=0)return curve[0];
  for(let i=1;i<CURVE_T.length;i++)if(min<=CURVE_T[i]){const a=CURVE_T[i-1],b=CURVE_T[i];return curve[i-1]+(curve[i]-curve[i-1])*(min-a)/(b-a);}

}
function lanePos(lane,t){
  const p=LANES[lane];let tot=0;const seg=[];
  for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);seg.push(d);tot+=d;}
  let d=Math.max(0,Math.min(1,t))*tot;
  for(let i=0;i<seg.length;i++){if(d<=seg[i]||i===seg.length-1){const k=seg[i]?d/seg[i]:0;return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k];}d-=seg[i];}
}

        if(rnd()<.6){const l=laneWithTower(lag);if(!l)return;const tw=nextTower(lag,l),g=pick(lead,4);send(g,[tw.x,tw.y],40);contest(lag,3,[tw.x,tw.y]);
          later(28,()=>{if(tw.alive){destroy(tw,lead,g,3);log("obj",lead,"🏰 Prise d'objectif : "+TN(lead)+" groupe à "+g.length+" et prend la tour "+l.toUpperCase(),{x:tw.x,y:tw.y,kind:"tower"});}});}
        else{const l=laneWithTower(lead);if(!l)return;const tw=nextTower(lead,l),lone=alive(lag)[Math.floor(rnd()*alive(lag).length)];send([lone],[tw.x,tw.y],40);
          later(28,()=>{if(tw.alive&&!lone.dead){destroy(tw,lag,[lone],4);log("obj",lag,"🗺️ Crossmap ! "+lone.name+" se retrouve seul en "+l.toUpperCase()+" et prend une tour",{x:tw.x,y:tw.y,kind:"crossmap"});}});}
      }
    }else{
      if(rnd()<.65){const g=pick(lead,4);send(g,PITS.baron,40);contest(lag,4,PITS.baron);later(28,()=>baron(lead,g,"👑 Prise d'objectif : "+TN(lead)+" prend le Nashor à "+g.length,"baron"));}
      else{const j=jgl(lag);send([j],PITS.baron,40);later(28,()=>baron(lag,[j],"⚡ STEAL DU NASHOR ! "+j.name+" vole le Nashor","steal"));}
    }
  }
  function updateSiege(){
    for(const t of["blue","red"]){let L=null;
      for(const l of LN)if(!nextTower(t,l)&&(t==="blue"?S.front[l]<=.09:S.front[l]>=.91)){L=l;break;}
      if(L&&!S.siege[t])log("siege",t,"🛡️ "+TN(t)+" est assiégée : repli général pour défendre la base",{x:BASES[t][0],y:BASES[t][1]});
      S.siege[t]=L;}
  }
  S.adv=()=>{const cb=teamCarry("blue"),cr=teamCarry("red");let k=0;for(const c of S.champs)k+=c.team==="blue"?c.k:-c.k;
    const x=(cb-cr)/(cb+cr)*5+(S.down.blue-S.down.red)*.13+(S.drakes.blue-S.drakes.red)*.09+(S.barons.blue-S.barons.red)*.2+k*.02+(S.nexus.red-S.nexus.blue)/100;
    return .5+.5*Math.tanh(x);};
  S.pending=()=>{for(let i=0;i<TIMINGS.length;i++)if(!S.resolved[i]&&S.tick>=TIMINGS[i]*TPM)return i;return null;};
  S.step=()=>{
    if(S.over)return;
    S.tick++;const min=minute();
    if(S.tick%80===1)for(const c of S.champs)if(c.role==="jng"){const r=rnd();c.jt=r<.4?null:LN[Math.floor(rnd()*3)];c.jc=rnd()<.5?0:1;}
    if(S.tick%5===0)updateSiege();
    if(S.pendingObj&&S.tick>=S.pendingObj.at){const f=S.pendingObj.fn;S.pendingObj=null;f();}
    else if(!S.pendingObj&&S.nextAuto<AUTO_T.length&&min>=AUTO_T[S.nextAuto]){S.nextAuto++;planObjective();}
    move();
    if(S.freeze>0){S.freeze--;return;}
    const accel=min<45?1:min<60?2:2+(min-60)*0.6;
    let lead=0;
    if(min>=60){lead=Math.sign(S.down.blue-S.down.red)||Math.sign(teamCarry("blue")-teamCarry("red"))||1;}
    for(const lane of LN){
      const pb=power("blue",lane),pr=power("red",lane);
      let adv=pb+pr>0?(pb-pr)/(pb+pr):0;adv+=lead*0.5;
      const tr=nextTower("red",lane),tb=nextTower("blue",lane);
      const hi=tr?tr.t-0.02:0.95,lo=tb?tb.t+0.02:0.05;
      let f=S.front[lane]+(adv*0.0035+(rnd()-.5)*0.004+((lo+hi)/2-S.front[lane])*0.003)*accel;
      const base=0.8*(1+min/15)*accel;
      if(f>=hi){f=hi;if(pb>0||lead>0){const dmg=base*Math.max(pb,lead>0?60:0)/50*(pr>0&&lead<=0?0.4:1);
        if(tr){tr.hp-=dmg;if(tr.hp<=0)destroy(tr,"blue",S.champs.filter(c=>c.team==="blue"&&!c.dead&&c.arrived&&laneOf(c)===lane),3);}
        else hitNexus("red",dmg*1.5);}}
      if(f<=lo){f=lo;if(pr>0||lead<0){const dmg=base*Math.max(pr,lead<0?60:0)/50*(pb>0&&lead>=0?0.4:1);
        if(tb){tb.hp-=dmg;if(tb.hp<=0)destroy(tb,"red",S.champs.filter(c=>c.team==="red"&&!c.dead&&c.arrived&&laneOf(c)===lane),3);}
        else hitNexus("blue",dmg*1.5);}}
      S.front[lane]=f;
      if(pb>0&&pr>0&&rnd()<0.007*accel){
        const w=rnd()<pb**4/(pb**4+pr**4)?"blue":"red",l=opp(w);
        const vs=S.champs.filter(c=>c.team===l&&!c.dead&&c.arrived&&laneOf(c)===lane),ks=S.champs.filter(c=>c.team===w&&!c.dead&&c.arrived&&laneOf(c)===lane);
        if(vs.length&&ks.length)kill(vs[Math.floor(rnd()*vs.length)],ks[Math.floor(rnd()*ks.length)]);
      }
      if(S.over)return;
    }
  };
  // Résout le fight du timing i avec les stratégies des deux joueurs
  S.resolve=(i,cb,cr)=>{
    S.resolved[i]=true;
    const min=TIMINGS[i],early=i<3,m=i>=6?2:1;
    let w=BEATS[cb]===cr?"blue":BEATS[cr]===cb?"red":null,tie=!w;
    const res={i,blue:cb,red:cr,winner:null,tie,text:""};S.last=res;
    if(tie&&cb==="farm"){S.champs.forEach(c=>c.bonus+=1);res.text="Les deux équipes farment tranquillement (+1 % chacun)";log("fight",null,res.text);return res;}
    if(tie){const sb=teamCarry("blue"),sr=teamCarry("red");w=rnd()<sb**6/(sb**6+sr**6)?"blue":"red";}
    if(rnd()<OUTPLAY_P){w=opp(w);res.outplay=true;}
    const l=opp(w),strat=w==="blue"?cb:cr,W=team(w);res.winner=w;
    let pos=null;
    if(early){
      const b=tie?2:4;W.forEach(c=>c.bonus+=b);
      if(strat==="dive"){killSome(l,2,w);pos=towerPos(l);res.text="Dive réussi";}
      else if(strat==="invade"){killSome(l,1,w);pos=CAMPS[l][0];res.text="Invade réussi";}
      else{killSome(l,1,w);pos=towerPos(w);res.text="Dive puni sous la tour";}
      res.text+=" : +"+b+" % de carry pour l'équipe";
    }else if(strat==="push"){
      let n=0;
      for(let k=0;k<m&&!S.over;k++){
        const tw=nextTower(l,"mid");   // Push together : uniquement la tour mid (sinon le Nexus)
        if(tw){destroy(tw,w,W.filter(c=>!c.dead),2);n++;}else hitNexus(l,50);
      }
      S.front.mid=w==="blue"?Math.max(S.front.mid,.6):Math.min(S.front.mid,.4);
      pos=lanePos("mid",S.front.mid);res.text="Push groupé mid : "+(n?(n>1?n+" tours mid détruites":"tour mid détruite"):"plus de tour mid, le Nexus est attaqué");
    }else if(strat==="split"){
      let n=0;const ls=[];   // Split push : uniquement une tour en sidelane (top ou bot)
      for(let k=0;k<m&&!S.over;k++){
        const rt=S.towers.filter(x=>x.team===l&&x.alive&&x.lane==="top").length,rb=S.towers.filter(x=>x.team===l&&x.alive&&x.lane==="bot").length;
        const lane=(rt>=rb&&rt>0)?"top":rb>0?"bot":"top";
        const tw=nextTower(l,lane),who=W.filter(c=>lane==="top"?c.role==="top":c.role==="adc"||c.role==="sup");
        if(tw){destroy(tw,w,who,5);n++;ls.push(lane);}else hitNexus(l,50);
      }
      if(ls.length)pos=nextTower(l,ls[ls.length-1])?[nextTower(l,ls[ls.length-1]).x,nextTower(l,ls[ls.length-1]).y]:towerPos(l);
      res.text="Split push "+(ls.length?[...new Set(ls)].join(" + "):"")+" : "+(n?(n>1?n+" tours en sidelane détruites":"tour en sidelane détruite"):"plus de tour en sidelane, le Nexus est attaqué");
    }else{
      killSome(l,1+m,w);killSome(w,1,l);
      if(min<30){S.drakes[w]+=m;W.forEach(c=>c.bonus+=5*m);pos=PITS.dragon;res.text="Teamfight gagné : "+(m>1?"2 dragons":"dragon")+" (+"+5*m+" % pour l'équipe)";}
      else{S.barons[w]+=1;W.forEach(c=>c.bonus+=8*m);pos=PITS.baron;const d=(w==="blue"?1:-1)*0.07*m;LN.forEach(x=>S.front[x]=Math.max(.05,Math.min(.95,S.front[x]+d)));res.text="Teamfight gagné : Nashor (+"+8*m+" % pour l'équipe)";}
    }
    S.freeze=30;S.fight={pos,until:S.tick+30};res.pos=pos;
    log("fight",w,(res.outplay?"OUTPLAY ! ":"")+res.text,pos?{x:pos[0],y:pos[1],op:!!res.outplay}:{op:!!res.outplay});return res;
  };
  return S;
}

const SND={ctx:null,on:localStorage.getItem("dm_snd")!=="0",music:localStorage.getItem("dm_mus")!=="0",mt:null,mi:0};
function actx(){
  if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.gain.value=.55;SND.master.connect(SND.ctx.destination);}

function tone(f,d,o={}){
  if(o.music?!SND.music:!SND.on)return;const c=actx();if(!c)return;
  const t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain(),v=o.vol||.15;
  os.type=o.type||"sine";os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g);g.connect(SND.master);os.start(t);os.stop(t+d+.05);
}
function noise(d,o={}){
  if(!SND.on)return;const c=actx();if(!c)return;
  const t=c.currentTime+(o.at||0),n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;

  f.type=o.ft||"lowpass";f.frequency.setValueAtTime(o.f||1000,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(f);f.connect(g);g.connect(SND.master);src.start(t);src.stop(t+d);
}

async function fbInit(){
  if(FB.db)return;
  for(const f of["firebase-app-compat.js","firebase-auth-compat.js","firebase-database-compat.js"])await loadScript(FIREBASE_SDK+f);

const newProfile=p=>({pseudo:p,chests:START_CHESTS,col:{},skins:{},wins:0,losses:0,be:0,skinOwn:{},daily:null});
const fixProfile=d=>{d.col=d.col||{};d.skins=d.skins||{};d.be=d.be||0;d.skinOwn=d.skinOwn||{};for(const k in d.skinOwn)d.skinOwn[k]=toArr(d.skinOwn[k]);d.daily=d.daily||null;d.chests=d.chests||0;d.wins=d.wins||0;d.losses=d.losses||0;return d;};
const slug=p=>p.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
function weakHash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36);}
async function login(pseudo,pass,create){
  const id=slug(pseudo);
  if(id.length<3)throw new Error("Pseudo : 3 caractères minimum (lettres, chiffres, _ ou -)");
  if(pass.length<6)throw new Error("Mot de passe : 6 caractères minimum");
  if(FB.on){
    await fbInit();const mail=id+"@draftmaster.game";
    try{
      const cred=create?await FB.auth.createUserWithEmailAndPassword(mail,pass):await FB.auth.signInWithEmailAndPassword(mail,pass);
      FB.uid=cred.user.uid;
    }catch(e){
      const c=e.code||"";
      if(c.includes("email-already-in-use"))throw new Error("Ce pseudo est déjà pris");
      if(c.includes("user-not-found")||c.includes("wrong-password")||c.includes("invalid-credential"))throw new Error("Pseudo ou mot de passe incorrect");
      throw e;
    }
    const snap=await FB.db.ref("users/"+FB.uid).get();
    ME=fixProfile(snap.val()||newProfile(pseudo.trim()));
    if(!snap.exists())await save();
  }else{
    const all=JSON.parse(localStorage.getItem("dm_users")||"{}");
    if(create){if(all[id])throw new Error("Ce pseudo est déjà pris");all[id]={pass:weakHash(pass),data:newProfile(pseudo.trim())};localStorage.setItem("dm_users",JSON.stringify(all));}
    if(!all[id]||all[id].pass!==weakHash(pass))throw new Error("Pseudo ou mot de passe incorrect");
    ME=fixProfile(all[id].data);ME._id=id;
  }
}
async function save(){
  if(!ME)return;
  const d={pseudo:ME.pseudo,chests:ME.chests,col:ME.col,skins:ME.skins,wins:ME.wins,losses:ME.losses,be:ME.be||0,skinOwn:ME.skinOwn||{},daily:ME.daily||null};
  if(FB.on)await FB.db.ref("users/"+FB.uid).set(d);
  else{const all=JSON.parse(localStorage.getItem("dm_users")||"{}");if(all[ME._id]){all[ME._id].data=d;localStorage.setItem("dm_users",JSON.stringify(all));}}
}

// Ordre de draft : 3 bans, 3 picks, 2 bans, 2 picks (comme sur LoL)
const SEQ=[["ban","blue"],["ban","red"],["ban","blue"],["ban","red"],["ban","blue"],["ban","red"],
 ["pick","blue"],["pick","red"],["pick","red"],["pick","blue"],["pick","blue"],["pick","red"],
 ["ban","red"],["ban","blue"],["ban","red"],["ban","blue"],
 ["pick","red"],["pick","blue"],["pick","blue"],["pick","red"]];
const other=s=>s==="blue"?"red":"blue";
const toArr=v=>!v?[]:Array.isArray(v)?v:Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]);
function draftView(st){
  const d={bans:{blue:[],red:[]},picks:{blue:[],red:[]},used:new Set()};
  st.actions.forEach((id,n)=>{const [type,side]=SEQ[n];d[type==="ban"?"bans":"picks"][side].push(id);if(id!=="-")d.used.add(id);});
  return d;
}
function validFor(st,n){
  const [type,side]=SEQ[n],d=draftView(st);
  const pool=Object.keys((type==="ban"?st[other(side)]:st[side]).col||{}).filter(id=>DATA.champs[id]&&!d.used.has(id));
  if(type==="pick"&&!pool.length)return DATA.list.map(c=>c.id).filter(id=>!d.used.has(id));
  return pool;
}
const fitOf=(id,role)=>{const c=DATA.champs[id];return c.roles[0]===role?2:c.roles.includes(role)?1:0;};
function assignRoles(ids){
  let best=null,bs=-1;
  const perm=(arr,k)=>{if(k===arr.length){let sc=0;arr.forEach((r,i)=>sc+=fitOf(ids[i],r));if(sc>bs){bs=sc;best=arr.slice();}return;}
    for(let i=k;i<arr.length;i++){[arr[k],arr[i]]=[arr[i],arr[k]];perm(arr,k+1);[arr[k],arr[i]]=[arr[i],arr[k]];}};
  perm(ROLES.slice(),0);
  return ids.map((id,i)=>({id,role:best[i]}));
}
// Ordre TOP, JGL, MID, ADC, SUP
const autoPos=ids=>assignRoles(ids).sort((a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role)).map(a=>a.id);
function buildTeams(st){
  const T={};
  for(const s of["blue","red"])T[s]=toArr(st.roles[s]).map((id,i)=>{const c=DATA.champs[id],role=ROLES[i],off=!c.roles.includes(role),count=(st[s].col||{})[id]||1;
    return{id,name:c.name,role,off,curve:c.curve,skin:(st[s].skins||{})[id]||0,mult:masteryMult(count)*(off?OFFROLE_MULT:1),ctr:""};});
  for(const s of["blue","red"])T[s].forEach((a,i)=>{let best=0,txt="";
    T[other(s)].forEach((b,j)=>{const[w,src]=ctrInfo(b.id,a.id);if(w>50&&(src==="u.gg"||i===j)){const v=ctrBonus(w)*(i===j?1:.5);if(v>best){best=v;txt=`Counter de ${b.name} (${ctrTxt(b.id,a.id)}) : +${v.toFixed(1)} % de carry`;}}});
    if(best){a.mult*=1+best/100;a.ctr=txt;}});
  for(const s of["blue","red"]){const a=T[s][3],p=T[s][4],[w,src]=duoInfo(a.id,p.id),b=synBonus(w);
    if(src&&b){const t=`Synergie botlane ${a.name} + ${p.name} (duo ${duoTxt(a.id,p.id)}) : ${b>0?"+":""}${b.toFixed(1)} %`;
      for(const x of[a,p]){x.mult*=1+b/100;x.syn=t;x.synv=b;}}}
  return T;
}
class LocalRoom{
  constructor(){
    this.net=false;this.side=Math.random()<.5?"blue":"red";
    const col={};while(Object.keys(col).length<32){const c=DATA.list[Math.floor(Math.random()*DATA.list.length)];col[c.id]=(col[c.id]||0)+1+(Math.random()<.3?Math.floor(Math.random()*3):0);}
    const me={uid:"me",pseudo:ME.pseudo,col:ME.col,skins:ME.skins},bot={uid:"bot",pseudo:"Bot Hextech",col,skins:{}};
    this.state={seed:Math.floor(Math.random()*2**31),actions:[],choices:{},left:{},roles:{}};
    this.state[this.side]=me;this.state[other(this.side)]=bot;
  }
  listen(cb){this.cb=cb;setTimeout(()=>this.emit(),0);}
  emit(){if(!this.cb)return;this.cb();this.bot();}
  bot(){
    const st=this.state,n=st.actions.length,bs=other(this.side);
    if(n<SEQ.length&&SEQ[n][1]===bs&&!this.thinking){this.thinking=true;
      this.timer=setTimeout(()=>{this.thinking=false;const v=validFor(st,n);let pickId="-";
        const dv=draftView(st),mine=dv.picks[bs],theirs=dv.picks[this.side];
        if(v.length){if(SEQ[n][0]==="ban"){const sb=id=>(st[this.side].col[id]||0)+mine.reduce((t,x)=>t+Math.max(0,ctrWR(x,id)-50),0)+Math.random();
            pickId=v.sort((a,b)=>sb(b)-sb(a))[Math.floor(Math.random()*Math.min(2,v.length))];}
          else{const have=new Set(mine.map(id=>DATA.champs[id].role));
            const sc=id=>{const c=DATA.champs[id];let x=(c.curve[1]+c.curve[3])/2*masteryMult(st[bs].col[id]||1)*(c.roles.some(r=>!have.has(r))?1:0.88)+Math.random()*2;
              theirs.forEach(e=>{x+=Math.max(0,ctrWR(e,id)-50)*1.5-Math.max(0,ctrWR(id,e)-50);});return x;};
            pickId=v.sort((a,b)=>sc(b)-sc(a))[0];}}
        this.act(n,pickId);},1100);}
  }
  act(n,id){if(this.state.actions.length===n){this.state.actions.push(id);this.emit();}}
  sendFx(fx){if(this.onFx)this.onFx(fx);}
  setRoles(side,arr){const r=this.state.roles,bs=other(this.side);if(!r[side])r[side]=arr.slice();
    if(!r[bs])r[bs]=autoPos(draftView(this.state).picks[bs]);setTimeout(()=>this.emit(),400);}
  choose(i,side,s){
    const ch=this.state.choices;ch[i]=ch[i]||{};if(!ch[i][side])ch[i][side]=s;
    const bs=other(this.side);if(!ch[i][bs]){const o=i<3?["farm","dive","invade"]:["push","fight","split"];ch[i][bs]=o[Math.floor(Math.random()*3)];}
  }
  leave(){clearTimeout(this.timer);this.cb=null;}
}
class NetRoom{
  constructor(id,side){this.net=true;this.id=id;this.side=side;this.ref=FB.db.ref("rooms/"+id);this.state={actions:[],choices:{},left:{},roles:{}};
    this.ref.child("left/"+side).onDisconnect().set(true);}
  listen(cb){this.cb=cb;this.h=this.ref.on("value",s=>{const v=s.val();if(!v)return;
    this.state={seed:v.seed,blue:v.blue,red:v.red,actions:toArr(v.actions),choices:v.choices||{},left:v.left||{},roles:v.roles||{}};
    // (les effets visuels "fx" sont lus séparément)
    for(const s2 of["blue","red"])if(this.state[s2]){this.state[s2].col=this.state[s2].col||{};this.state[s2].skins=this.state[s2].skins||{};}
    if(this.cb)this.cb();});
    this.fh=this.ref.child("fx").on("child_added",s=>{const v=s.val();if(v&&Math.abs(Date.now()-v.t)<30000&&this.onFx)this.onFx(v);});}
  act(n,id){this.ref.child("actions/"+n).transaction(c=>c===null?id:undefined);}
  sendFx(fx){this.ref.child("fx").push(fx);}
  setRoles(side,arr){this.ref.child("roles/"+side).transaction(c=>c===null?arr:undefined);}
  choose(i,side,s){this.ref.child("choices/"+i+"/"+side).transaction(c=>c===null?s:undefined);}
  leave(){this.cb=null;this.onFx=null;this.ref.off("value",this.h);this.ref.child("fx").off("child_added",this.fh);this.ref.child("left/"+this.side).set(true);this.ref.child("left/"+this.side).onDisconnect().cancel();}
}

let M=null;
function cleanupMatch(){
  if(typeof document!=="undefined")document.title="DraftMaster";
  if(!M)return;
  clearInterval(M.iv);cancelAnimationFrame(M.raf);
  if(M.room)M.room.leave();
  if(M.queueMine&&FB.db){FB.db.ref("queue").transaction(c=>c&&c.uid===FB.uid?null:undefined);if(M.waitRoom)FB.db.ref("rooms/"+M.waitRoom).remove();}
  M=null;
}
function startLocal(){M={phase:"draft",room:new LocalRoom()};M.room.listen(onRoom);}
async function startOnline(){
  $("#app").innerHTML=`<div class="center panel"><h2>Recherche d'un adversaire…</h2><p class="mut">Garde cette page ouverte. Un ami peut cliquer « Jouer en ligne » en même temps.</p><button class="sec" id="cq">Annuler</button></div>`;
  $("#cq").onclick=showMenu;
  M={phase:"queue"};const mine=M;
  try{
    const db=FB.db,uid=FB.uid,me={uid,pseudo:ME.pseudo,col:ME.col,skins:ME.skins};
    const newId=db.ref("rooms").push().key;let taken=null;
    await db.ref("rooms/"+newId).set({seed:Math.floor(Math.random()*2**31),t:Date.now(),blue:me});
    await db.ref("queue").transaction(cur=>{taken=null;if(cur&&cur.uid!==uid&&Date.now()-cur.t<120000){taken=cur;return null;}return{uid,room:newId,t:Date.now()};});
    if(M!==mine){db.ref("rooms/"+newId).remove();if(!taken)db.ref("queue").transaction(c=>c&&c.uid===uid?null:undefined);return;}
    if(taken){
      db.ref("rooms/"+newId).remove();
      await db.ref("rooms/"+taken.room+"/red").set(me);
      M.room=new NetRoom(taken.room,"red");
    }else{
      M.queueMine=true;M.waitRoom=newId;db.ref("queue").onDisconnect().remove();
      M.room=new NetRoom(newId,"blue");
    }
    M.room.listen(onRoom);
  }catch(e){toast("Erreur réseau : "+(e.message||e));showMenu();}
}
function onRoom(){
  if(!M||!M.room)return;const st=M.room.state,side=M.room.side;
  if(M.phase==="queue"){
    if(!st.blue||!st.red)return;
    if(M.queueMine){M.queueMine=false;M.waitRoom=null;FB.db.ref("queue").onDisconnect().cancel();}
    M.phase="draft";
  }
  if(st.left[other(side)]&&M.phase!=="end"){
    if(M.phase==="game"){endGame(side,true);}
    else{toast("Ton adversaire a quitté la draft.");showMenu();}
    return;
  }
  if(M.phase==="draft")renderDraft();
  else if(M.phase==="pos")renderPos();
}
function turnFlash(type){const d=document.createElement("div");d.className="turnflash "+type;d.innerHTML=`<span>À TOI DE ${type==="ban"?"BANNIR":"CHOISIR"} !</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}
function renderDraft(){
  const room=M.room,st=room.state,side=room.side,n=st.actions.length,d=draftView(st);
  if(M.draftN!==n){M.draftN=n;M.deadline=Date.now()+DRAFT_TURN_S*1000;M.sel=null;M.lastTick=null;
    if(n>0){if(st.actions[n-1]==="-")SFX.tick();else if(SEQ[n-1][0]==="ban")SFX.ban();else SFX.pick();}
    if(n<SEQ.length&&SEQ[n][1]===side){setTimeout(SFX.turn,350);setTimeout(()=>{if(M&&M.room&&M.phase==="draft"&&M.room.state.actions.length===n)turnFlash(SEQ[n][0]);},250);}}
  M.filter=M.filter||"all";
  if(n>=SEQ.length){
    if(!M.locked){M.locked=true;clearInterval(M.iv);M.iv=null;setTimeout(()=>{if(M&&M.phase==="draft"){M.phase="pos";renderPos();}},1800);}
  }else if(!M.iv){
    M.iv=setInterval(()=>{
      if(!M||M.phase!=="draft")return;const s=M.room.state,k=s.actions.length;if(k>=SEQ.length)return;

    },250);
  }
  const done=n>=SEQ.length,[type,turn]=done?["",""]:SEQ[n],mine=turn===side;
  const slot=(s,t,i)=>{const arr=d[t==="ban"?"bans":"picks"][s],id=arr[i];
    const cur=!done&&turn===s&&type===t&&arr.length===i;

  const sideHTML=s=>`<div class="side ${s} ${!done&&turn===s?"active":""}"><b class="${s==="blue"?"tb":"tr"}">${esc(st[s].pseudo)}${s===side?" (toi)":""}</b>
    <div class="slots">${[0,1,2,3,4].map(i=>slot(s,"pick",i)).join("")}</div><div class="slots">${[0,1,2,3,4].map(i=>slot(s,"ban",i)).join("")}</div></div>`;
  const valid=done?[]:validFor(st,n);
  const showSide=!done&&mine&&type==="ban"?other(side):side;
  const pool=Object.keys(st[showSide].col).filter(id=>DATA.champs[id]).sort((a,b)=>ROLES.indexOf(DATA.champs[a].role)-ROLES.indexOf(DATA.champs[b].role)||DATA.champs[a].name.localeCompare(DATA.champs[b].name,"fr"));
  const extra=mine&&type==="pick"&&!pool.some(id=>valid.includes(id))?valid.slice(0,20):[];
  const enemyPicks=d.picks[other(side)].filter(x=>DATA.champs[x]),myPicks=d.picks[side].filter(x=>DATA.champs[x]);
  const nm=a=>a.map(x=>DATA.champs[x[0]].name+" "+x[2]).join(", ");
  const badge=id=>{let up=[],dn=[];
    if(showSide===side){enemyPicks.forEach(e=>{const w=ctrWR(e,id);if(w>50)up.push([e,w,ctrTxt(e,id)]);const w2=ctrWR(id,e);if(w2>50)dn.push([e,w2,ctrTxt(id,e)]);});}
    else myPicks.forEach(e=>{const w=ctrWR(e,id);if(w>50)dn.push([e,w,ctrTxt(e,id)]);});
    let sy="";
    if(showSide===side){const c=DATA.champs[id];let best=null;
      myPicks.forEach(x=>{const X=DATA.champs[x];
        if(c.roles.includes("sup")&&X.roles.includes("adc")){const[w,src]=duoInfo(x,id);if(src&&(!best||Math.abs(w-50)>Math.abs(best[0]-50)))best=[w,`${X.name} + ${c.name} : duo ${duoTxt(x,id)}`];}
        if(c.roles.includes("adc")&&X.roles.includes("sup")){const[w,src]=duoInfo(id,x);if(src&&(!best||Math.abs(w-50)>Math.abs(best[0]-50)))best=[w,`${c.name} + ${X.name} : duo ${duoTxt(id,x)}`];}});
      if(best&&best[0]!==50)sy=`<span class="cb ${best[0]>50?"syn":"dn"}" title="Synergie botlane — ${esc(best[1])}">${best[0]>50?"🤝":"💔"}</span>`;}
    if(!up.length&&!dn.length&&!sy)return"";
    const est=up.length&&up.every(x=>/estimé/.test(x[2]));
    return `<span class="bd">${up.length?`<span class="cb up${est?" est":""}" title="Counter de : ${esc(nm(up))}${est?" (estimé : ne compte que face à son vis-à-vis de lane)":""}">⚔ ${up.length>1?up.length:""}</span>`:""}${dn.length?`<span class="cb dn${dn.every(x=>/estimé/.test(x[2]))?" est":""}" title="${showSide===side?"Se fait counter par":"Counter de tes picks"} : ${esc(nm(dn))}">⚠ ${dn.length>1?dn.length:""}</span>`:""}${sy}</span>`;};
  const shown=pool.concat(extra).filter(id=>M.filter==="all"||DATA.champs[id].roles.includes(M.filter));
  const msg=done?"Draft terminée — placement des rôles…":mine?(type==="ban"?"À toi de BANNIR un champion adverse":"À toi de CHOISIR un champion"):"L'adversaire "+(type==="ban"?"bannit":"choisit")+"…";
  document.title=!done&&mine?"🔔 À toi ! — DraftMaster":"DraftMaster";
  const left=Math.max(0,Math.ceil((M.deadline-Date.now())/1000)),opp=esc(st[other(side)].pseudo);
  const tl=SEQ.map(([t,s2],i)=>`<span class="tl ${s2} ${i<n?"done":""} ${i===n?"now":""} ${s2===side?"me":""}" title="${i+1}. ${t==="ban"?"Ban":"Pick"} — ${s2===side?"toi":"adversaire"}">${t==="ban"?"✕":(s2===side?"★":"●")}</span>`).join("");
  const banner=done?`<div class="turnbar wait"><span class="tbi">✅</span><div><b>Draft terminée</b><span>Place maintenant tes champions sur les postes…</span></div></div>`
    :mine?`<div class="turnbar mine ${type}"><span class="tbi">${type==="ban"?"🚫":"✋"}</span><div><b>À TOI DE ${type==="ban"?"BANNIR":"CHOISIR"} !</b><span>${type==="ban"?"Clique un champion de la collection adverse pour l'interdire":"Clique un champion de ta collection"}, puis « ${type==="ban"?"Bannir":"Choisir"} » (ou double-clic)</span></div><span class="tbt" id="dt2">${left}</span></div>`
    :`<div class="turnbar wait"><span class="tbi">⏳</span><div><b>Tour de ${opp}</b><span>Il ${type==="ban"?"bannit":"choisit"} un champion… Prépare ton prochain choix.</span></div><span class="tbt small" id="dt2">${left}</span></div>`;
  const selC=M.sel&&DATA.champs[M.sel];
  const actbar=!done&&mine?`<div class="actbar ${type}">${selC?`<img src="${icon(M.sel)}" alt="" onerror="this.style.visibility='hidden'"><div><small>${type==="ban"?"Bannir":"Choisir"}</small><b>${esc(selC.name)}</b></div>`:`<span class="mut">👆 Sélectionne un champion ci-dessus</span>`}
    <button id="dv2" class="${selC?"pulse":""}" ${selC?"":"disabled"}>${type==="ban"?"🚫 Bannir":"✔ Choisir"}</button></div>`:"";
  $("#app").innerHTML=`${banner}<div class="timeline">${tl}</div><div class="draftbar">${sideHTML("blue")}<div><div class="timer ${!done&&mine?"mine":""}" id="dt">${done?"":left}</div><div class="small mut" style="text-align:center">${done?"":`Action ${n+1}/${SEQ.length}`}</div></div>${sideHTML("red")}</div>
   <div class="panel ${!done&&!mine?"waiting":""}"><div class="row sp"><h3>${msg}</h3><div class="row"><button id="dv" ${mine&&M.sel?"":"disabled"}>Valider</button><button class="sec" id="dq">Quitter</button></div></div>
   <p class="mut small">${showSide!==side?"Collection de ton adversaire":"Ta collection"} · chiffres = carry à 0 / 20 / 45 min · <span class="cb up">⚔</span> counter d'un champion adverse déjà choisi · <span class="cb dn">⚠</span> ${showSide!==side?"counter un de tes picks":"se fait counter"} (stats u.gg, survole pour le détail) · <span class="cb syn">🤝</span> synergie botlane avec un de tes picks</p>
   <div class="chips" id="fl">${["all",...ROLES].map(r=>`<button data-r="${r}" class="${M.filter===r?"on":""}">${r==="all"?"Tous":ROLE_LBL[r]}</button>`).join("")}</div>
   <div class="grid" id="dg">${shown.map(id=>tileHTML(id,{count:st[showSide].col[id],skin:(st[showSide].skins||{})[id],badge:badge(id),cls:(mine&&valid.includes(id)?"":"dis")+(M.sel===id?" sel":"")})).join("")}</div></div>${actbar}`;
  if($("#dv2"))$("#dv2").onclick=()=>{if(M.sel)room.act(n,M.sel);};
  $("#dg").ondblclick=e=>{const t=e.target.closest(".tile");if(t&&mine&&valid.includes(t.dataset.id))room.act(n,t.dataset.id);};
  $("#fl").onclick=e=>{const b=e.target.closest("button");if(b){M.filter=b.dataset.r;renderDraft();}};
  $("#dq").onclick=showMenu;
  $("#dv").onclick=()=>{if(M.sel)room.act(n,M.sel);};
  $("#dg").onclick=e=>{const t=e.target.closest(".tile");if(!t||!mine||M.sel===t.dataset.id)return;M.sel=t.dataset.id;const y=window.scrollY;renderDraft();window.scrollTo(0,y);};
}

/* ---------- Phase 1b : placement des rôles ---------- */
const POS_S=30;
function renderPos(){
  document.title="DraftMaster";
  const room=M.room,st=room.state,side=room.side,d=draftView(st),roles=st.roles||{};
  if(!M.pos){
    M.pos=autoPos(d.picks[side]);M.posEnd=Date.now()+POS_S*1000;M.posSel=null;M.lastTick=null;
    clearInterval(M.iv);M.iv=setInterval(()=>{
      if(!M||M.phase!=="pos"||M.matchup)return;
      const left=(M.posEnd-Date.now())/1000,r=M.room.state.roles||{},el=$("#pt");if(el)el.textContent=Math.max(0,Math.ceil(left));
      if(!r[side]&&left>0&&left<=5&&Math.ceil(left)!==M.lastTick){M.lastTick=Math.ceil(left);SFX.tick();}
      if(left<=0&&!r[side])M.room.setRoles(side,M.pos);

    <p class="mut small">${locked?"Placement validé — en attente de l'adversaire…":"Clique sur deux lignes pour échanger les champions. Un champion hors de ses rôles perd 10 % de carry. Les counters comptent face à ton vis-à-vis de lane."}</p>
    <div id="pr" style="${locked?"pointer-events:none;opacity:.7":""}">${rows}</div>
    <div class="synbox">${synLine(M.pos[3],M.pos[4])}</div>
    <div class="row sp" style="margin-top:6px"><div class="row small mut">Adversaire : ${ens.map(x=>`<img src="${icon(x)}" alt="" title="${esc(DATA.champs[x].name)}" style="width:34px;height:34px;border-radius:50%" onerror="this.style.display='none'">`).join("")}</div>
    <div class="row"><button id="pv" ${locked?"disabled":""}>Valider</button><button class="sec" id="pq">Quitter</button></div></div></div>`;
  $("#pq").onclick=showMenu;
  $("#pv").onclick=()=>{SFX.lock();room.setRoles(side,M.pos);};
  $("#pr").onclick=e=>{const t=e.target.closest(".posrow");if(!t)return;const i=+t.dataset.i;
    if(M.posSel===null)M.posSel=i;else{if(M.posSel!==i)[M.pos[M.posSel],M.pos[i]]=[M.pos[i],M.pos[M.posSel]];M.posSel=null;}renderPos();};
}
function renderMatchup(){
  const st=M.room.state,side=M.room.side,T=buildTeams(st),me=T[side],op=T[other(side)];
  const rows=ROLES.map((r,i)=>{const a=me[i],b=op[i],wa=ctrWR(b.id,a.id),wb=ctrWR(a.id,b.id);

      <div class="c"><b>${ROLE_LBL[r]}</b><br>${mid}</div>
      <div class="r">${off(b)}${esc(b.name)}<img src="${icon(b.id,b.skin)}" alt="" onerror="this.style.visibility='hidden'"></div></div>`;}).join("");

    ${rows}<div class="vsyn"><div>${synLine(me[3].id,me[4].id)}</div><div>${synLine(op[3].id,op[4].id)}</div></div><p class="mut small" style="text-align:center">Winrate du counter sur sa lane (u.gg). Un counter gagne jusqu'à +${CTR_MAX} % de carry contre son vis-à-vis, la moitié contre le reste de l'équipe.</p></div>`;

}

/* ---------- Phase 2 : la partie ---------- */
const STRATS={farm:["Farm safe","🌾","Bat Dive"],dive:["Dive","🗡️","Bat Invade"],invade:["Invade","👣","Bat Farm safe"],
  push:["Push together","🏰","Tour mid · bat Teamfight"],fight:["Teamfight","⚔️","Dragon / Nashor · bat Split"],split:["Split push","🔀","Tour top / bot · bat Push"]};
const EMOTES=["👏","🔥","😱","😂","🤡","GG"];
const TEAMC={blue:"#3fa7ff",red:"#ff4d5e"};
const IMG={};
function img(src){if(!src)return null;if(!IMG[src]){const i=new Image();i.src=src;IMG[src]=i;}return IMG[src];}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function startGame(){
  clearInterval(M.iv);M.iv=null;
  const room=M.room,st=room.state,side=room.side;
  M.phase="game";
  M.sim=createSim(st.seed,buildTeams(st));M.sndEv=0;
  M.sim.champs.forEach(c=>{c.rx=c.x;c.ry=c.y;c.vhp=100;c.vlag=100;c.hpT=100;c.atk=0;img(icon(c.id,c.skin));});
  M.asking=null;M.acc=0;M.lastT=performance.now();M.evShown=0;
  Object.assign(M,{cam:{x:500,y:500,z:1},autoCam:true,focus:null,hover:null,parts:[],pings:[],kills:[],shake:0,flash:0,advHist:[.5],advT:0,advS:null,pitDown:{},hudT:0});
  $("#app").innerHTML=`
  <div class="gtop">
    <div class="gteam blue"><b>${esc(st.blue.pseudo)}${side==="blue"?" (toi)":""}</b><span id="hb"></span></div>
    <div class="gclock"><span id="clock">00:00</span><small id="nextf"></small></div>
    <div class="gteam red"><span id="hr"></span><b>${esc(st.red.pseudo)}${side==="red"?" (toi)":""}</b></div>
  </div>
  <div class="advbar" title="Quelle équipe est en train de gagner (carry, kills, tours, objectifs, Nexus)"><div class="advfill" id="advf"></div><svg id="advg" viewBox="0 0 100 20" preserveAspectRatio="none"></svg><div class="advmark" id="advm"></div><span class="advl" id="advl">Égalité</span></div>
  <div class="game"><div class="mapwrap"><canvas id="map" width="1000" height="1000"></canvas>
     <div id="kf" class="killfeed"></div><div id="fx" class="fxlayer"></div><div id="rib" class="ribbons"></div><div id="info" class="cinfo"></div><div id="ov"></div>
     <div class="maptools"><button class="sec" id="cam" title="La caméra suit les combats">🎥 Auto</button><button class="sec off" id="unz" title="Vue d'ensemble">🗺️ Vue globale</button></div></div>
  <div class="gside"><div class="panel sbp" id="sb"></div>
    <div class="panel emotes"><div class="small mut">Clique un champion pour le suivre · clique la carte pour pinger · envoie une émote :</div>
      <div class="row">${EMOTES.map(e=>`<button class="sec emo" data-e="${e}">${e}</button>`).join("")}</div></div>
    <div class="panel feed" id="feed"></div><div><button class="sec" id="gq">Abandonner</button></div></div></div>`;
  $("#gq").onclick=()=>{if(confirm("Abandonner la partie ?"))showMenu();};
  $("#cam").onclick=()=>{M.autoCam=!M.autoCam;M.focus=null;$("#cam").classList.toggle("off",!M.autoCam);};
  $("#unz").onclick=()=>{M.focus=null;M.autoCam=false;$("#cam").classList.add("off");};
  document.querySelector(".emotes").onclick=e=>{const b=e.target.closest(".emo");if(!b||Date.now()-(M.lastEmo||0)<1200)return;M.lastEmo=Date.now();sendFx({k:"emo",e:b.dataset.e});};
  const cv=$("#map");
  cv.onclick=e=>{const w=toWorld(e),c=pickChamp(w);if(c){M.focus=M.focus===c?null:c;return;}
    if(Date.now()-(M.lastPing||0)<600)return;M.lastPing=Date.now();sendFx({k:"ping",x:Math.round(w[0]),y:Math.round(w[1])});};
  cv.onmousemove=e=>{M.hover=pickChamp(toWorld(e));cv.style.cursor=M.hover?"pointer":"crosshair";};
  cv.onmouseleave=()=>{M.hover=null;};
  $("#sb").onpointerdown=e=>{const r=e.target.closest("[data-ci]");if(r){const c=M.sim.champs[+r.dataset.ci];M.focus=M.focus===c?null:c;M.hudT=0;}};
  $("#info").onpointerdown=e=>{if(e.target.closest("#ix")){M.focus=null;M.hudT=0;}};
  room.onFx=applyFx;
  M.iv=setInterval(gameTick,100);
  const loop=()=>{if(!M||!M.sim)return;draw();M.raf=requestAnimationFrame(loop);};loop();
  gameTick();
}
function sendFx(fx){fx.side=M.room.side;fx.t=Date.now();if(M.room.net)M.room.sendFx(fx);else applyFx(fx);}
function applyFx(fx){
  if(!M||M.phase!=="game")return;
  if(fx.k==="ping"){M.pings.push({x:fx.x,y:fx.y,side:fx.side,t:performance.now()});SFX.ping();}
  if(fx.k==="emo"){const d=document.createElement("div");d.className="emofly";d.textContent=fx.e;
    d.style.left=(fx.side==="blue"?6+Math.random()*22:62+Math.random()*22)+"%";d.style.top=(fx.side==="blue"?68:16)+"%";
    d.style.color=TEAMC[fx.side];const l=$("#fx");if(l){l.appendChild(d);setTimeout(()=>d.remove(),2300);}SFX.pop();}
}
function toWorld(e){const cv=$("#map"),r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*1000/r.width,sy=(e.clientY-r.top)*1000/r.height,T=M.camT||{z:1,ox:0,oy:0};return[(sx-T.ox)/T.z,(sy-T.oy)/T.z];}
function pickChamp(w){let best=null,bd=34;for(const c of M.sim.champs){if(c.dead)continue;const d=Math.hypot(c.rx-w[0],c.ry-w[1]);if(d<bd){bd=d;best=c;}}return best;}
function gameTick(){
  if(!M||M.phase!=="game")return;
  const sim=M.sim,room=M.room,side=room.side,now=performance.now();
  let steps=Math.min(50,Math.floor((M.acc+now-M.lastT)/100));M.acc=(M.acc+now-M.lastT)-steps*100;M.lastT=now;
  if(steps<1&&sim.pending()===null){hud();return;}
  steps=Math.max(steps,1);
  for(let s=0;s<steps;s++){
    if(sim.over)break;
    const p=sim.pending();
    if(p!==null){
      M.acc=0;
      if(M.asking!==p){M.asking=p;M.choiceEnd=Date.now()+CHOICE_S*1000;M.myChoice=null;M.lastTick=null;showChoice(p);}
      const ch=room.state.choices[p]||{},left=(M.choiceEnd-Date.now())/1000,opts=p<3?["farm","dive","invade"]:["push","fight","split"];
      const el=$("#ct");if(el)el.textContent=Math.max(0,Math.ceil(left));
      if(!ch[side]&&left>0&&left<=3&&Math.ceil(left)!==M.lastTick){M.lastTick=Math.ceil(left);SFX.tick();}
      if(left<=0&&!ch[side])room.choose(p,side,M.myChoice||opts[Math.floor(Math.random()*3)]);
      if(room.net&&left<=-6&&!ch[other(side)])room.choose(p,other(side),opts[0]);
      const c2=room.state.choices[p]||{};
      if(c2.blue&&c2.red){const r=sim.resolve(p,c2.blue,c2.red);M.asking=null;showBanner(r);M.lastT=performance.now();}
      break;
    }
    sim.step();
  }
  hud();
  if(sim.over)setTimeout(()=>endGame(sim.over,false),1800);
}
function showChoice(p){
  const opts=p<3?["farm","dive","invade"]:["push","fight","split"],side=M.room.side;
  SFX.turn();
  $("#ov").innerHTML=`<div class="choice"><div class="chead"><span>Minute ${TIMINGS[p]}${p>=6?" · effets ×2":""}</span><b>Choisis ta stratégie</b><span class="ctime" id="ct">${CHOICE_S}</span></div>
   <div class="opts">${opts.map(o=>`<button class="strat" data-o="${o}"><span class="si">${STRATS[o][1]}</span><span class="sn">${STRATS[o][0]}</span><small>${STRATS[o][2]}</small></button>`).join("")}</div>
   <div class="small mut" style="text-align:center;margin-top:8px">Attention : ${Math.round(OUTPLAY_P*100)} % de chance qu'un fight perdu soit retourné par un outplay.</div></div>`;
  $("#ov").querySelectorAll(".strat").forEach(b=>b.onclick=()=>{
    if(M.myChoice)return;M.myChoice=b.dataset.o;b.classList.add("pick");SFX.lock();
    $("#ov").querySelectorAll(".strat").forEach(x=>{if(x!==b)x.disabled=true;});
    M.room.choose(p,side,M.myChoice);});
}
function showBanner(r){
  const side=M.room.side,me=r[side],op=r[other(side)],won=r.winner===side;

  g.save();g.globalAlpha=.18;g.strokeStyle="#bfefff";g.lineWidth=3;g.setLineDash([18,40]);g.lineDashOffset=-now/40;g.beginPath();g.moveTo(170,170);g.quadraticCurveTo(470,530,830,830);g.stroke();g.lineDashOffset=-now/55+20;g.beginPath();g.moveTo(150,190);g.quadraticCurveTo(450,560,810,850);g.stroke();g.restore();
  // monstres épiques
  const min=sim.minute();g.textAlign="center";g.textBaseline="middle";
  for(const k of["dragon","baron"]){if(k==="baron"&&min<20)continue;if((M.pitDown[k]||0)>now)continue;const p=PITS[k],br=1+.06*Math.sin(now/500+(k==="baron"?2:0));
    g.save();g.shadowColor=k==="dragon"?"#ff8a3d":"#c77dff";g.shadowBlur=26;g.font=`${48*br|0}px serif`;g.fillText(k==="dragon"?"🐉":"🐍",p[0],p[1]);g.restore();}
  // sbires
  for(const l of LN)for(const t of["blue","red"]){const f=sim.front[l],sg=t==="blue"?-1:1,col=TEAMC[t];
    const pts=[];for(let k=0;k<4;k++){const p=lanePos(l,f+sg*(.016+k*.011));pts.push([p[0]+Math.sin(now/180+k*2+(sg>0?1:0))*3,p[1]+Math.cos(now/210+k)*3]);}
    const ph=(now/1000/8+(t==="blue"?0:.5)+LN.indexOf(l)*.21)%1,st=t==="blue"?.03:.97,en=f+sg*.05;
    if(ph<.92)for(let k=0;k<3;k++){const p=lanePos(l,st+(en-st)*clamp(ph-k*.02,0,1));pts.push(p);}
    g.fillStyle=col;g.strokeStyle="rgba(0,0,0,.6)";g.lineWidth=1.5;for(const p of pts){g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill();g.stroke();}}
  for(const w of sim.towers)drawTower(g,w,now);
  for(const t of["blue","red"])drawNexus(g,t,sim.nexus[t],now);
  // zone de combat
  if(sim.fight&&sim.tick<sim.fight.until&&sim.fight.pos){const p=sim.fight.pos,R=70+Math.sin(now/120)*8;
    g.save();g.strokeStyle="#f0d48c";g.lineWidth=4;g.shadowColor="#f0d48c";g.shadowBlur=20;g.beginPath();g.arc(p[0],p[1],R,0,7);g.stroke();g.restore();g.font="34px serif";g.fillText("⚔️",p[0],p[1]-R-14);}
  // champions
  const alive=sim.champs.filter(c=>!c.dead),best=sim.champs.reduce((a,c)=>sim.carry(c)>sim.carry(a)?c:a,sim.champs[0]);
  for(const c of sim.champs){
    if(c.dead){c.vhp=100;c.vlag=100;c.hpT=100;c.rx=BASES[c.team][0];c.ry=BASES[c.team][1];continue;}
    c.rx+=(c.x-c.rx)*.12;c.ry+=(c.y-c.ry)*.12;
    let tgt=null,td=95;for(const e of alive)if(e.team!==c.team){const d=Math.hypot(e.rx-c.rx,e.ry-c.ry);if(d<td){td=d;tgt=e;}}
    // Vie visuelle : tend en douceur vers une cible selon le rapport de force, avec des échanges qui oscillent
    const fz=sim.fight&&sim.tick<sim.fight.until&&sim.fight.pos&&Math.hypot(sim.fight.pos[0]-c.rx,sim.fight.pos[1]-c.ry)<170;
    if(tgt){const r=sim.carry(c)/(sim.carry(c)+sim.carry(tgt));
      c.hpT=fz?14+56*r:58+36*r+9*Math.sin(now/1100+c.jx*6);
      if(now>c.atk){c.atk=now+260+Math.random()*420;M.parts.push({t:"pj",x:c.rx,y:c.ry,tx:tgt.rx,ty:tgt.ry,c:TEAMC[c.team],life:.22,max:.22});
        if(Math.random()<.45)ftxt(tgt.rx+(Math.random()-.5)*30,tgt.ry-34,String(30+Math.random()*sim.carry(c)*3|0),c.team===M.room.side?"#f0d48c":"#ff9aa5",18,.8);}}
    else c.hpT=100;
    if(fz&&!tgt)c.hpT=60;
    const dn=c.hpT<c.vhp;c.vhp+=(c.hpT-c.vhp)*Math.min(1,dt*(dn?(fz?1.6:.7):.55));
    c.vlag+=(c.vhp-c.vlag)*Math.min(1,dt*(c.vlag>c.vhp?1.4:6));
  }
  for(const c of sim.champs){
    if(c.dead)continue;
    if(c.task&&sim.tick<c.task.until){g.save();g.setLineDash([6,8]);g.lineDashOffset=-now/40;g.strokeStyle=TEAMC[c.team];g.globalAlpha=.7;g.lineWidth=2.5;g.beginPath();g.moveTo(c.rx,c.ry);g.lineTo(c.task.x,c.task.y);g.stroke();g.restore();}
    const foc=M.focus===c,hov=M.hover===c,R=foc?30:26,col=TEAMC[c.team],im=img(icon(c.id,c.skin));
    g.fillStyle="rgba(0,0,0,.45)";g.beginPath();g.ellipse(c.rx,c.ry+R-2,R*.9,R*.35,0,0,7);g.fill();
    g.save();g.shadowColor=col;g.shadowBlur=foc?30:14;g.beginPath();g.arc(c.rx,c.ry,R+3,0,7);g.fillStyle=col;g.fill();g.restore();
    g.save();g.beginPath();g.arc(c.rx,c.ry,R,0,7);g.closePath();g.fillStyle="#0e1a28";g.fill();g.clip();
    if(im&&im.complete&&im.naturalWidth)g.drawImage(im,c.rx-R,c.ry-R,R*2,R*2);else{g.fillStyle="#f0e6d2";g.font="bold 15px Inter,sans-serif";g.fillText(c.name.slice(0,3),c.rx,c.ry);}
    g.restore();
    if(foc){g.save();g.strokeStyle="#f0d48c";g.lineWidth=3;g.setLineDash([8,6]);g.lineDashOffset=now/30;g.beginPath();g.arc(c.rx,c.ry,R+9,0,7);g.stroke();g.restore();}
    const bw=56,by=c.ry-R-14;g.fillStyle="rgba(0,0,0,.8)";g.fillRect(c.rx-bw/2-1,by-1,bw+2,8);g.fillStyle="rgba(255,240,200,.75)";g.fillRect(c.rx-bw/2,by,bw*c.vlag/100,6);g.fillStyle=c.vhp>35?(c.team===M.room.side?"#3ddc84":"#ff4d5e"):"#ff8a3d";g.fillRect(c.rx-bw/2,by,bw*c.vhp/100,6);
    if(c===best){g.font="18px serif";g.fillText("👑",c.rx,by-12);}
    if(foc||hov){g.font="bold 15px Inter,sans-serif";g.lineWidth=4;g.strokeStyle="rgba(0,0,0,.85)";const lb=`${c.name} · ${sim.carry(c).toFixed(1)}`;g.strokeText(lb,c.rx,c.ry+R+16);g.fillStyle="#f0e6d2";g.fillText(lb,c.rx,c.ry+R+16);}
  }
  // morts : fantômes à la fontaine
  const dead={blue:0,red:0};
  for(const c of sim.champs){if(!c.dead)continue;const b=BASES[c.team],k=dead[c.team]++,a=(c.team==="blue"?-.9:2.2)+k*.55,x=b[0]+Math.cos(a)*95,y=b[1]+Math.sin(a)*95,im=img(icon(c.id,c.skin));
    g.save();g.globalAlpha=.55;g.beginPath();g.arc(x,y,17,0,7);g.clip();if(im&&im.complete&&im.naturalWidth){g.filter="grayscale(1)";g.drawImage(im,x-17,y-17,34,34);}else{g.fillStyle="#333";g.fill();}g.restore();
    g.font="bold 15px Inter,sans-serif";g.fillStyle="#fff";g.strokeStyle="#000";g.lineWidth=3;const s=String(Math.max(0,Math.ceil((c.dead-sim.tick)/10)));g.strokeText(s,x,y);g.fillText(s,x,y);}
  // particules
  for(const p of M.parts){p.life-=dt;const a=clamp(p.life/p.max,0,1);
    if(p.t==="sp"){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93;g.globalAlpha=a;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*(.4+a),0,7);g.fill();}
    else if(p.t==="ring"){g.globalAlpha=a;g.strokeStyle=p.c;g.lineWidth=6*a+1;g.beginPath();g.arc(p.x,p.y,p.R*(1-a)+8,0,7);g.stroke();}
    else if(p.t==="txt"){p.y+=p.vy*dt;g.globalAlpha=a;g.font=`900 ${p.size}px Cinzel,Georgia,serif`;g.lineWidth=4;g.strokeStyle="rgba(0,0,0,.8)";g.strokeText(p.s,p.x,p.y);g.fillStyle=p.c;g.fillText(p.s,p.x,p.y);}
    else if(p.t==="pj"){const k=1-a,x=p.x+(p.tx-p.x)*k,y=p.y+(p.ty-p.y)*k;g.globalAlpha=1;g.strokeStyle=p.c;g.lineWidth=3;g.beginPath();g.moveTo(x-(p.tx-p.x)*.12,y-(p.ty-p.y)*.12);g.lineTo(x,y);g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(x,y,3.5,0,7);g.fill();}
    else if(p.t==="beam"){g.globalAlpha=a;const gr=g.createLinearGradient(0,p.y-300,0,p.y);gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(1,p.c);g.fillStyle=gr;g.fillRect(p.x-30*a,p.y-300,60*a,300);}
    g.globalAlpha=1;}
  M.parts=M.parts.filter(p=>p.life>0);if(M.parts.length>900)M.parts.splice(0,M.parts.length-900);
  // pings
  M.pings=M.pings.filter(p=>now-p.t<2600);
  for(const p of M.pings){const k=(now-p.t)/2600,col=TEAMC[p.side];
    for(let j=0;j<2;j++){const q=(k*2+j*.5)%1;g.globalAlpha=1-q;g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.arc(p.x,p.y,10+q*55,0,7);g.stroke();}
    g.globalAlpha=1-k*.6;g.font="900 34px Cinzel,serif";g.lineWidth=5;g.strokeStyle="#000";g.strokeText("!",p.x,p.y-40-Math.abs(Math.sin(now/120))*6);g.fillStyle=col;g.fillText("!",p.x,p.y-40-Math.abs(Math.sin(now/120))*6);g.globalAlpha=1;}
  // écran : vignette + flash
  g.setTransform(1,0,0,1,0,0);
  const vg=g.createRadialGradient(500,500,380,500,500,720);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.55)");g.fillStyle=vg;g.fillRect(0,0,1000,1000);
  if(M.flash>0){g.fillStyle=`rgba(255,244,214,${M.flash*.28})`;g.fillRect(0,0,1000,1000);M.flash=Math.max(0,M.flash-dt*2.2);}
}
function endGame(winner,forfeit){
  if(!M||M.phase==="end")return;
  M.phase="end";clearInterval(M.iv);
  const win=winner===M.room.side;win?SFX.win():SFX.lose();
  ME.chests++;if(win)ME.wins++;else ME.losses++;
  const dly=daily();dly.played++;if(win)dly.won++;ME.be=(ME.be||0)+BE_PER_GAME;
  save().catch(e=>toast("Sauvegarde impossible : "+e.message));
  const sim=M.sim,mine=sim.champs.filter(c=>c.team===M.room.side),best=mine.slice().sort((a,b)=>sim.carry(b)-sim.carry(a))[0];
  const kills=t=>sim.champs.reduce((s,c)=>s+(c.team===t?c.k:0),0),me=M.room.side,op=other(me);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="panel endp ${win?"win":"lose"}"><div class="endt">${win?"VICTOIRE":"DÉFAITE"}</div>
   <p class="mut">${forfeit?"Ton adversaire a quitté la partie.":"Nexus détruit à la minute "+Math.floor(sim.minute())+"."}</p>
   <div class="mvp"><img src="${art(best.id,best.skin)}" alt="" onerror="this.style.visibility='hidden'"><div><small>MVP DE TON ÉQUIPE</small><div style="font-family:Cinzel,serif;font-size:22px;font-weight:900">${esc(best.name)}</div><div>Carry ${sim.carry(best).toFixed(1)} · ${best.k}/${best.d}</div></div></div>
   <div class="estats"><span>⚔ ${kills(me)} – ${kills(op)}</span><span>🗼 ${sim.down[me]} – ${sim.down[op]}</span><span>🐉 ${sim.drakes[me]} – ${sim.drakes[op]}</span><span>👑 ${sim.barons[me]} – ${sim.barons[op]}</span></div>
   <p><span class="tag new">+1 coffre Hextech</span> <span class="tag bev">+${BE_PER_GAME} <i class="bei"></i> essence bleue</span></p>
   <p class="small">📅 Missions du jour mises à jour : ${MISSIONS.filter(x=>x.p(dly)>=x.goal&&!dly.claimed[x.k]).length} récompense(s) d'essence bleue à réclamer au menu.</p><button id="eb">Retour au menu</button></div>`;
  document.body.appendChild(m);m.querySelector("#eb").onclick=()=>{m.remove();showMenu();};
}

/* ---------- Démarrage ---------- */
if(typeof document!=="undefined"){
  $("#app").innerHTML='<div class="center panel"><div class="logo">DraftMaster</div><p class="mut">Chargement des champions…</p></div>';
  soundUI();
  loadData().then(()=>showLogin());
}
